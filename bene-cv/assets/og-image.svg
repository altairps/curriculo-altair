<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Altair Santos — Product Designer">
  <title>Altair Santos — Product Designer · Mobility, SaaS &amp; Digital Products</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F7F6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="16" height="630" fill="#0F766E"/>
  <circle cx="990" cy="132" r="58" fill="#0F766E"/>
  <text x="990" y="146" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">AS</text>
  <g transform="translate(72,166)">
