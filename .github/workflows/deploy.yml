name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'altair-cv/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'altair-cv/**'
      - 'tests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  audit:
    name: Accessibility audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Serve static site
        run: |
          python3 -m http.server 4321 --directory altair-cv &
          npx --yes wait-on http://localhost:4321/

      - name: Run PT-BR suite
        working-directory: tests
        env:
          BASE_URL: http://localhost:4321/
        run: npm test

      - name: Run EN keyboard test
        working-directory: tests
        env:
          BASE_URL: http://localhost:4321/en/
        run: npm run test:keyboard

      - name: Run EN axe test
        working-directory: tests
        env:
          BASE_URL: http://localhost:4321/en/
        run: npm run test:a11y

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: audit
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: altair-cv

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
